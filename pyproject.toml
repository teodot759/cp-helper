[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-helper"
version = "0.1.0"
description = "A single-file C++ scratchpad with test cases, verdicts and diffs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6-Essentials>=6.6",
    "psutil>=5.9",
]

[project.scripts]
cpp-helper = "cppjudge.__main__:main"

[tool.setuptools.packages.find]
include = ["cppjudge*"]

[tool.setuptools.package-data]
cppjudge = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the gate to real defects; the remaining style rules only add noise here.
select = ["E4", "E7", "E9", "F"]
